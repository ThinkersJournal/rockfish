[package]
name = "rockfish-hip-emit"
description = "HIP C++ emitter for the neutral `unpopped` kernel generator: the `Hip` `Backend` that lowers a `KernelPlan` to HIP kernel source text. Emits text only; compilation by a HIP compiler is UNVERIFIED. No ROCm or GPU needed to build or test."
publish = false
readme = "README.md"
# TRACKS UNPOPPED, not the Rockfish workspace number (CireSnave's one-version rule, exception for
# a crate built to work with another project; PM ruling 2026-10-31, as `baracuda-cuda-emit`): the
# number answers "which Unpopped does this work with?". 0.63.3 = the `unpopped` it is built and
# tested against; bump it at every unpopped take (cluster ruling 2026-11-28). The PM allocates the number at gate time.
version = "0.63.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The hipRTC `Compiler`; runtime-loaded, so enabling it needs no ROCm to build.
hiprtc = ["dep:rockfish-hiprtc"]

[dependencies]
unpopped = "0.63.3"
rockfish-hiprtc = { path = "../rockfish-hiprtc", version = "=0.7.2", optional = true }
unpopped-vocab = "0.63.3"

[dev-dependencies]
# The parse side of the same ownership: the round-trip tests lift what `Hip` emits.
rockfish-hip-parse = { path = "../rockfish-hip-parse", version = "0.63.3" }
unpopped-convert = "0.63.3"
# The published one-kernel-per-`Stmt`-variant fixtures: every one is checker-valid.
unpopped = { version = "0.63.3", features = ["fixtures"] }
