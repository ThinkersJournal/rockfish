[package]
name = "rockfish-hip"
description = "Safe Rust layer over the AMD HIP runtime, runtime-loaded; no ROCm needed to build."
publish = false
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rockfish-core = { path = "../rockfish-core", version = "=0.0.26" }
rockfish-hip-sys = { path = "../rockfish-hip-sys", version = "=0.0.26" }
half = { version = "2.7.1", optional = true, default-features = false }
thiserror = "2.0.21"

[features]
# `DeviceRepr` for `half::f16` and `half::bf16`, the types Fuel hands to Baracuda.
half = ["dep:half"]
